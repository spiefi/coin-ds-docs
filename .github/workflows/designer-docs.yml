name: Designer docs

# Keeps GitHub and Vercel in sync: every change to designer-docs on main is
# verified (build, guide check, headless browser test of every guide) and only
# then deployed to production. Pull requests get the same checks and, when they
# pass, a preview deployment. Do not deploy the docs by hand.

on:
  push:
    branches: [main]
    paths:
      - 'designer-docs/**'
      - '.github/workflows/designer-docs.yml'
  pull_request:
    paths:
      - 'designer-docs/**'
      - '.github/workflows/designer-docs.yml'
  workflow_dispatch:

concurrency:
  group: designer-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: designer-docs

env:
  VERCEL_ORG_ID: team_X0VoDx8wnIAl5BxPYptzkK8K
  VERCEL_PROJECT_ID: prj_9hD7JPEDcUJ6UsR16Knrn805j6Rh

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: designer-docs/package-lock.json

      - name: Allow reading the private Coin components package
        # jfs-components installs from the private repo spiefi/coin-components.
        # COIN_COMPONENTS_DEPLOY_KEY is a read-only deploy key for that repo.
        env:
          COIN_COMPONENTS_DEPLOY_KEY: ${{ secrets.COIN_COMPONENTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$COIN_COMPONENTS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Install dependencies
        run: npm ci

      - name: Check Chrome is available
        run: google-chrome --version

      - name: Build, guide check, and browser test
        run: npm run verify

  deploy:
    needs: verify
    # Forked pull requests have no access to the Vercel token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: designer-docs/package-lock.json

      - name: Allow reading the private Coin components package
        # jfs-components installs from the private repo spiefi/coin-components.
        # COIN_COMPONENTS_DEPLOY_KEY is a read-only deploy key for that repo.
        env:
          COIN_COMPONENTS_DEPLOY_KEY: ${{ secrets.COIN_COMPONENTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$COIN_COMPONENTS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Install dependencies
        run: npm ci

      # Build here and upload the result: Vercel's own build servers cannot
      # read the private components repo.
      - name: Build and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            target="production"
            prod="--prod"
          else
            target="preview"
            prod=""
          fi
          npx --yes vercel@60 pull --yes --environment="$target" --token "$VERCEL_TOKEN"
          npx --yes vercel@60 build $prod --token "$VERCEL_TOKEN"
          url=$(npx --yes vercel@60 deploy --prebuilt $prod --token "$VERCEL_TOKEN")
          echo "Deployed ${target}: ${url}"
          echo "### Designer docs ${target} deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"
